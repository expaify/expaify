name: Comp Access Expiry

on:
  schedule:
    - cron: '0 7 * * *'  # once daily, 3am ET
  workflow_dispatch:

jobs:
  comp-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Expire due admin-granted comp access on prod
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          curl -fsSL --max-time 60 \
            -X POST https://expaify.com/api/admin/comp-expiry \
            -H "Authorization: Bearer ${PIPELINE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Expired: {d.get(\"expiredCount\", 0)}')
          "
