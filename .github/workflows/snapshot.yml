name: Nightly Snapshot

on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC daily
  workflow_dispatch:       # allow manual trigger

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline on prod
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          curl -fsSL --max-time 310 \
            -X POST https://expaify.com/api/pipeline/run \
            -H "Authorization: Bearer ${PIPELINE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/pipeline-result.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/pipeline-result.json'))
          print(f'Markets: {d[\"markets\"]}')
          print(f'New deals: {d[\"totalNewDeals\"]}')
          print(f'Alerts sent: {d[\"alertsSent\"]}')
          print(f'Empty markets: {d.get(\"emptyMarketCount\", \"?\")}/{d.get(\"marketsAttempted\", \"?\")}')
          if d.get('rateLimited'):
              print('::error::Pipeline aborted early — RAPIDAPI_KEY quota exhausted (429). No snapshots were collected this run. Rotate/upgrade the RapidAPI key.')
              sys.exit(1)
          # A run that reports ok:true while most markets came back with zero
          # hotels used to be indistinguishable from a normal night -- this is
          # exactly how the pipeline silently produced no real deals for a
          # month (2026-07-06 to 2026-07-27) with every run still green here.
          if d.get('pipelineDegraded'):
              print('::error::Pipeline ran but ' + str(d.get('emptyMarketCount')) + '/' + str(d.get('marketsAttempted')) + ' markets returned zero hotels. Every provider is likely failing -- check RAPIDAPI_KEY validity and provider response shapes before assuming this is a quiet night.')
              sys.exit(1)
          "
